<style>
/* =========================================================
   스튜디오형 화면 (2026-10) — 아르떼노바 밝은 베이지 바탕 · 가운데 큰 화면 · 양옆 아이콘 줄
   · 아래 필름/타임라인 · 아래에서 올라오는 도구 판. 위의 런치박스 스킨을 덮어써요.
   ========================================================= */
:root{--panel:#FFFFFF;--panel2:#EDE5D6;--line:#E2D8C8;--ink:#1E1C1A;--ink2:#5E554C;--mute:#8A8073;--rec:#E2412E;--rail:clamp(58px,9.4cqw,86px);--dark:#1E1C1A}

/* ---------- 공통 부품: 평평한 흰 키 ---------- */
.tray{margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;padding:clamp(6px,2.2cqh,12px) clamp(8px,1.6cqw,16px);gap:clamp(6px,2cqh,10px)}
.tray::before{display:none}
.well{background:var(--panel2);box-shadow:none}
.key{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px #5E46301a;border-radius:12px}
.key:active,.key.down{transform:scale(.96);box-shadow:none}
.key.orange{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 2px 8px #CF5D2A40}
.key.orange:active,.key.orange.down{box-shadow:none}
.key.dark{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:none}
.key.dim{background:#F3EDE2;border-color:transparent;color:var(--ink2);box-shadow:none}
.key.on{background:#CF5D2A14;border-color:var(--orange);color:#B4491D;transform:none;box-shadow:none}
.btn{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px #5E46301a}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.primary,.btn.jade,.btn.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:none}
.btn.accent,.btn.rec{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 2px 8px #CF5D2A40}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.chip{background:#fff;border:1px solid var(--line);box-shadow:none}
.seg{background:var(--panel2);box-shadow:none}
.seg button.on{background:var(--ink);box-shadow:none}
.card,.sc-card,.script-row,.scene,.work-i{background:#fff;box-shadow:0 1px 3px #5E46301f}
.field input,.field textarea,.field select,.input{background:#fff;border:1px solid var(--line);box-shadow:none}
.toggle input{box-shadow:none}
.modal-bg{background:#3B302659}
.modal{background:var(--panel);border:0;border-radius:20px;box-shadow:0 18px 44px #3B302647}
.choice button{background:#fff;border:1px solid var(--line);box-shadow:none}
.sbtn{background:#fff;border:1px solid var(--line);box-shadow:none}
.sbtn.on{background:var(--c-bgm);border-color:var(--c-bgm);box-shadow:none}
.fxk.sel{box-shadow:0 0 0 2.5px var(--kc)}
.toast{background:var(--ink);box-shadow:0 8px 24px #1113}
.lcd-t{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:clamp(15px,5cqh,24px);color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 모니터: 베젤 없이 둥근 화면 */
.monitor{background:#000;padding:0;border:0;border-radius:14px;box-shadow:0 4px 16px #5E463033}
.monitor .stage-wrap{border-radius:14px;box-shadow:none}

/* ---------- 시작 · 제작 과정 ---------- */
#process .tray{cursor:pointer;justify-content:center}
#process .proc-top{height:clamp(40px,13cqh,64px)}
.proc-slot{background:transparent;padding:0}
.proc-item{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 8px #5E463022}
.proc-item.next{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 6px 18px #CF5D2A55}
.proc-item.next .no{color:#FFE3CF}

/* ---------- 이야기 고르기: 그림 카드 ---------- */
#library .tray{padding-top:clamp(8px,3cqh,16px)}
.lib-top{height:clamp(36px,11cqh,52px);align-items:center}
.lib-top .lcd-t{justify-content:flex-start;font-size:clamp(14px,4.6cqh,20px)}
.lib-top .brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:clamp(13px,4.4cqh,18px);white-space:nowrap}
.lib-top .brand i{width:clamp(24px,8cqh,32px);height:clamp(24px,8cqh,32px);border-radius:8px;background:var(--orange);color:#fff;display:grid;place-items:center}
.lib-top .brand i svg{width:62%;height:62%}
.lib-top .key{height:100%;border-radius:999px;padding:0 clamp(10px,1.8cqw,16px);flex-direction:row;gap:6px}
.lib-top .key .ki{width:clamp(15px,5cqh,20px);height:clamp(15px,5cqh,20px)}
.lib-top .key.home{width:auto;aspect-ratio:1;padding:0}
.lib-top .key.works{width:auto}
.lib-top .key.newst{background:var(--orange);border-color:var(--orange);color:#fff}
.lib-top .key.newst i{background:transparent;width:auto;height:auto}
.lib-top .key.newst i svg{width:clamp(15px,5cqh,20px);height:clamp(15px,5cqh,20px)}
.tale-grid{background:transparent;padding:0}
.cas{border:0;border-radius:14px;padding:0;overflow:hidden;background:var(--hue-bg,#D9CFC0);box-shadow:0 2px 6px #5E463026;color:#fff;justify-content:flex-end;filter:none;transform:none}
.cas .art{position:absolute;inset:0;background:var(--art)}
.cas .art svg{position:absolute;right:8%;top:12%;width:42%;height:auto;opacity:.5;color:#fff}
.cas .lab,.cas .tape{display:none}
.cas .tt{position:relative;padding:0 clamp(6px,1.2cqw,10px) clamp(5px,1.8cqh,9px);font-family:var(--display);font-weight:800;font-size:clamp(11px,3.8cqh,16px);line-height:1.15;text-align:left;text-shadow:0 1px 3px #0007;word-break:keep-all}
.cas .bd{position:absolute;right:6px;top:6px;font-size:clamp(9px,2.8cqh,11px);font-weight:800;border-radius:999px;padding:1px 8px;background:#0000006b;color:#fff;display:flex;align-items:center;gap:3px}
.cas .bd svg{width:1.1em;height:1.1em}
.cas.on .bd{background:var(--orange)}
.cas:not(.on){filter:saturate(.45);opacity:.6}
.cas.on{cursor:pointer;box-shadow:0 4px 14px #5E463040}
.cas.on:active{transform:scale(.97)}

/* ---------- 이야기 갈래 (전래동화 · 팔도 민담 · 나만의 이야기) ---------- */
.lib-top .key.hall{background:var(--ink);border-color:var(--ink);color:#fff}
.tale-grid.v-home{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:clamp(8px,1.8cqw,18px);padding:clamp(4px,2cqh,14px) 0}
.kind{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:clamp(2px,1cqh,6px);text-align:left;border:1px solid var(--line);border-radius:22px;background:#fff;padding:clamp(10px,2.4cqw,22px);overflow:hidden;cursor:pointer;color:var(--ink);box-shadow:0 4px 14px #5E463024;font:inherit}
.kind:active{transform:scale(.97)}
.kind .kart{position:absolute;left:0;right:0;top:0;height:52%;background:radial-gradient(circle at 70% 30%,color-mix(in srgb,var(--kc) 70%,#fff),var(--kc));display:grid;place-items:center;color:#fff}
.kind .kart svg{width:clamp(34px,18cqh,84px);height:clamp(34px,18cqh,84px);stroke-width:1.6}
.kind b{font-family:var(--display);font-weight:900;font-size:clamp(16px,6cqh,28px);color:var(--ink)}
.kind .ks{font-size:clamp(11px,3.4cqh,14px);color:var(--ink2);line-height:1.35;word-break:keep-all}
.kind[data-kind=map]{box-shadow:0 6px 20px #CF5D2A40;border-color:#CF5D2A66}
/* 팔도 지도 */
.tale-grid.v-map{grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:clamp(8px,1.6cqw,16px);padding:0}
.map-wrap{height:100%;aspect-ratio:640/1000;min-height:0;background:#DCEBF0;border-radius:16px;overflow:hidden}
.kmap{display:block;width:100%;height:100%}
.kmap .do{stroke:#fff;stroke-width:3;stroke-linejoin:round;transition:opacity .25s}
.kmap .do.dim{opacity:.45}
.kmap .do-n{font:800 34px var(--display);fill:#1E1C1A55;text-anchor:middle;pointer-events:none}
.kmap .isle{fill:#8FB8E0;stroke:#fff;stroke-width:2}
.kmap .isle-n{font:700 26px var(--display);fill:#1E1C1A88;text-anchor:middle;pointer-events:none}
.kmap .pin{cursor:pointer;outline:none}
.kmap .pin .hit{fill:transparent}
.kmap .pin .dot{fill:var(--orange);stroke:#fff;stroke-width:5}
.kmap .pin .ring{fill:none;stroke:var(--orange);stroke-width:6;transform-box:fill-box;transform-origin:center;animation:pinPulse 1.6s ease-out infinite;animation-delay:var(--d)}
.kmap .pin .pin-n{font:800 30px var(--display);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round;opacity:0;transition:opacity .2s;pointer-events:none}
.kmap .pin.sel .pin-n,.kmap .pin:hover .pin-n{opacity:1}
.kmap .pin.sel .dot{fill:var(--ink)}
.kmap .pin.sel .ring{stroke:var(--ink)}
@keyframes pinPulse{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(2.6);opacity:0}}
.map-side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,1.4cqh,8px);background:#fff;border-radius:16px;padding:clamp(8px,2.4cqh,16px) clamp(10px,1.6cqw,18px);box-shadow:0 1px 3px #5E46301f}
.ms-head{display:flex;align-items:center;gap:8px;flex:none}
.ms-head b{font-family:var(--display);font-weight:900;font-size:clamp(15px,5cqh,22px)}
.do-chip{border-radius:999px;padding:2px 10px;font-size:clamp(11px,3.2cqh,13px);font-weight:800;color:#1E1C1A}
.ms-tabs{flex:none;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ms-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:clamp(3px,1.2cqh,8px)}
.ms-body h3{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(16px,5.6cqh,32px);color:#A8441A}
.ms-sub{font-size:clamp(11px,3.4cqh,17px);color:var(--ink2);font-weight:700}
.ms-body p{margin:0;font-size:clamp(12px,3.8cqh,19px);line-height:1.6;word-break:keep-all}
.ms-sc{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ms-sc .chip{font-size:clamp(11px,3.2cqh,16px);padding:3px 9px}
.key.ms-go{flex:none;height:clamp(40px,12cqh,54px);border-radius:999px;flex-direction:row;gap:8px;font-size:clamp(14px,4.6cqh,18px)}
.key.ms-go .ki{order:2}
/* ---------- 상영관 (순위 · 감상 · 별점) ---------- */
.tale-grid.v-theater{display:flex;flex-direction:column;padding:0}
.th-list{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));align-content:start;gap:clamp(6px,1.6cqh,10px)}
.th-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;align-items:center;gap:clamp(6px,1.2cqw,12px);border:1px solid var(--line);background:#fff;border-radius:14px;padding:clamp(5px,1.6cqh,9px) clamp(8px,1.2cqw,12px);text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px #5E46301f}
.th-row:active{transform:scale(.98)}
.th-row .rk{width:clamp(24px,8cqh,34px);height:clamp(24px,8cqh,34px);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(13px,4.4cqh,18px);background:var(--panel2);color:var(--ink2)}
.th-row.top1 .rk{background:#F2C14E;color:#5B3D00}
.th-row.top2 .rk{background:#C9CED6;color:#333}
.th-row.top3 .rk{background:#D9925B;color:#fff}
.th-row.top1{border-color:#F2C14E;box-shadow:0 4px 14px #F2C14E55}
.th-row .th{width:clamp(56px,20cqh,96px);aspect-ratio:16/9;border-radius:8px;background:#1E1C1A center/cover}
.th-t{display:flex;flex-direction:column;min-width:0}
.th-t b{font-family:var(--display);font-weight:800;font-size:clamp(13px,4.4cqh,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-t small,.th-s small{color:var(--mute);font-size:clamp(10px,3cqh,12px)}
.th-s{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.th-p{width:clamp(28px,9cqh,38px);height:clamp(28px,9cqh,38px);border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center}
.th-p svg{width:45%;height:45%}
.stars{display:inline-flex;gap:1px}
.stars i{display:block;width:clamp(12px,4cqh,16px);height:clamp(12px,4cqh,16px);color:#D9CFC0}
.stars i svg{width:100%;height:100%;fill:currentColor;stroke:none}
.stars i.on{color:#F2B21C}
.stars i.half{color:#F2B21C;opacity:.5}
.th-empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:420px}
.th-empty>span svg{width:56px;height:56px;color:var(--mute)}
.th-empty b{font-family:var(--display);font-size:20px}
/* 감상 화면: 왼쪽 큰 화면 | 오른쪽 별점 */
.tw{position:absolute;inset:0;z-index:40;background:var(--bg,#F4EFE5);display:grid;grid-template-columns:minmax(0,1fr) clamp(170px,28cqw,280px);gap:clamp(6px,1.4cqw,14px);padding:clamp(6px,2cqh,14px) clamp(8px,1.4cqw,14px);padding-left:max(clamp(8px,1.4cqw,14px),env(safe-area-inset-left));padding-right:max(clamp(8px,1.4cqw,14px),env(safe-area-inset-right))}
.tw-stage{min-width:0;min-height:0;display:grid;place-items:center;container-type:size}
.tw-stage .monitor{width:min(100cqw,100cqh*16/9);aspect-ratio:16/9;height:auto}
.tw-side{min-height:0;min-width:0;display:flex;flex-direction:column;gap:clamp(3px,1.2cqh,10px);background:#fff;border-radius:16px;padding:clamp(8px,2.4cqh,14px);overflow:auto}
.tw-top{display:flex;align-items:flex-start;gap:6px}
.tw-top b{flex:1;font-family:var(--display);font-weight:900;font-size:clamp(15px,5cqh,21px);line-height:1.2;word-break:keep-all}
.tw-top .key{width:clamp(32px,10cqh,40px);height:clamp(32px,10cqh,40px);flex:none;padding:0}
.tw-avg{display:flex;flex-direction:column;gap:2px}
.tw-avg small{color:var(--mute);font-size:12px}
.tw-side>.key.orange{height:clamp(34px,10cqh,52px);border-radius:999px;flex:none}
.tw-rate{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:clamp(4px,1.4cqh,8px)}
.tw-give{display:flex;gap:2px}
.tw-give button{flex:1 1 0;min-width:0;aspect-ratio:1;max-width:46px;border:0;background:none;padding:2px;color:#D9CFC0;cursor:pointer}
.tw-give button svg{width:100%;height:100%;fill:currentColor;stroke:none}
.tw-give button.on{color:#F2B21C}
.tw-give.done button{cursor:default}
.tw-msg{font-size:12px}
.tw-acts{margin-top:auto;gap:4px;flex-wrap:wrap}

/* ---------- 작업 화면 공통 틀: 왼쪽 줄 | 가운데 화면 | 오른쪽 줄 / 아래 타임라인 ---------- */
#studio .tray{padding:clamp(4px,1.6cqh,10px) clamp(4px,1cqw,10px)}
.lay{--g:clamp(5px,1.8cqh,10px);--tlh:clamp(62px,24cqh,140px);grid-template-columns:var(--rail) minmax(0,1fr) var(--rail);grid-template-rows:minmax(0,1fr) var(--tlh);gap:var(--g) clamp(4px,.9cqw,10px)}
.lay > .L,.lay > .RR{grid-row:1;display:flex;flex-direction:column;align-items:stretch;gap:clamp(2px,1cqh,7px);min-height:0}
.lay > .L{grid-column:1}.lay > .RR{grid-column:3}
.lay > .M{grid-column:2;grid-row:1;position:relative;container-type:size;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.lay > .M > .monitor{width:min(100cqw,calc(100cqh * 16 / 9));height:auto;max-height:100%}
.lay > .B{grid-column:1 / -1;grid-row:2}
.lay > .B .tlw{background:var(--panel2);border-radius:12px}
.lay .navrow{display:contents}
.lay .navrow .navkey .kl{display:inline}

/* 아이콘 줄의 키: 둥근 아이콘 + 짧은 글자 */
.rail .key,.lay > .L > .key,.lay > .RR > .key,.lay .navrow .key{background:transparent;border:0;box-shadow:none;flex:none;height:auto;min-height:0;padding:1px 0;gap:1px;flex-direction:column;border-radius:10px;width:auto}
.rail .key .ki,.lay > .L > .key .ki,.lay > .RR > .key .ki,.lay .navrow .key .ki,.transport .key .ki{width:clamp(28px,10.5cqh,42px)!important;height:clamp(28px,10.5cqh,42px)!important;box-sizing:border-box;padding:clamp(5px,2.2cqh,9px);border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px #5E46301a}
.rail .key .kl,.lay > .L > .key .kl,.lay > .RR > .key .kl,.lay .navrow .key .kl{font-size:clamp(8.5px,2.8cqh,11px);font-weight:700;color:var(--ink2);max-width:100%}
.rail .key.on .ki,.lay > .L > .key.on .ki,.lay > .RR > .key.on .ki{background:#CF5D2A1c;border-color:var(--orange);color:var(--orange)}
.rail .key.on .kl,.lay > .RR > .key.on .kl{color:#B4491D}
.rail .key.orange .ki,.lay > .RR > .key.orange .ki{background:var(--orange);border-color:var(--orange);color:#fff}
.rail .key.orange .kl,.lay > .RR > .key.orange .kl{color:#B4491D}
.rail .key:active .ki,.lay > .L > .key:active .ki,.lay > .RR > .key:active .ki{transform:scale(.92)}
.rail .key[disabled],.lay > .L > .key[disabled]{opacity:.35}
.lay > .RR > .key.rec .ki{width:clamp(46px,17cqh,66px)!important;height:clamp(46px,17cqh,66px)!important;background:var(--rec);border:0;color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 5px #1E1C1A26,0 6px 14px #E2412E55;padding:clamp(10px,4cqh,17px)}
.lay > .RR > .key.rec.recording .ki{animation:blink 1s infinite}
.lay > .RR > .gap,.lay > .L > .gap{flex:1;min-height:0}

/* 재생 키 묶음 (왼쪽 줄 아래) */
.transport{margin-top:auto;padding:0;background:transparent;grid-template-columns:1fr 1fr;gap:clamp(2px,1cqh,6px) 2px;justify-items:center}
.transport .key{background:transparent;border:0;box-shadow:none;height:auto!important;padding:0;width:auto}
.transport .play .ki{width:clamp(34px,13cqh,50px)!important;height:clamp(34px,13cqh,50px)!important;background:var(--orange);border-color:var(--orange);color:#fff;padding:clamp(8px,3.4cqh,13px)}
.transport .key:not(.play) .ki{width:clamp(24px,8.4cqh,32px)!important;height:clamp(24px,8.4cqh,32px)!important;padding:clamp(4px,1.8cqh,7px)}
.transport .time{font-size:clamp(8.5px,2.8cqh,11px)}

/* 다음 키: 화면 오른쪽 위 주황 알약 (모든 단계 같은 자리) */
.nextkey.pill{position:absolute;z-index:8;top:max(8px,calc((100cqh - 100cqw * 9 / 16) / 2 + 8px));right:max(8px,calc((100cqw - 100cqh * 16 / 9) / 2 + 8px));height:auto;min-height:0;border-radius:999px;flex-direction:row;gap:6px;padding:clamp(4px,1.6cqh,7px) clamp(8px,1.4cqw,12px) clamp(4px,1.6cqh,7px) clamp(10px,1.6cqw,15px);box-shadow:0 3px 10px #0000003d}
.nextkey.pill .nk-a{order:2}
.nextkey.pill .nk-a .kl{display:none}
.nextkey.pill .nk-a .ki{width:clamp(13px,4.4cqh,17px);height:clamp(13px,4.4cqh,17px)}
.nextkey.pill .nk-b{order:1;font-size:clamp(11px,3.6cqh,14px);font-weight:800;opacity:1}
.nextkey.pill .nk-b::before{content:"다음 · ";font-weight:600;opacity:.85}
