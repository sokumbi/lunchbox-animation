<style>
/* =========================================================
   단순한 세 화면 테마 (2026-10-31) — 검은 바탕 · 크고 이름 붙은 아이콘
   p1_head의 런치박스 스킨 위에 덮어써요. 화면은 p6_simple.js
   ========================================================= */
:root{--acc:#CF5D2A;--rec:#FF3B30;--panel:#1c1c1e;--panel2:#2c2c2e;--panel3:#3a3a3c;--spring:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.2,.9,.25,1.12);--rail:clamp(66px,11cqw,96px)}
body,#app,.screen{background:#000;color:#fff}
#studio .tray{margin:0;border:0;border-radius:0;background:#000;box-shadow:none;padding:0;gap:0}
#studio .tray::before{display:none}
.btn{background:var(--panel2);border:0;color:#fff;box-shadow:none;border-radius:12px}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.primary,.btn.accent,.btn.rec{background:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.input,.field input,.field textarea{background:var(--panel2);color:#fff;border:0;box-shadow:none}
.toggle input{box-shadow:none;accent-color:var(--acc)}
.toast{background:#2c2c2ef0;color:#fff;box-shadow:0 6px 20px #0008;animation:toastIn .38s var(--spring) both}
.toast.out{animation:toastOut .22s ease both}
.toast.top{top:calc(18% + env(safe-area-inset-top,0px));bottom:auto}
.stage-wrap,.monitor{aspect-ratio:var(--ar,1.7778)}
.monitor{background:#000;padding:0;border:0;border-radius:14px;box-shadow:none}
.monitor .stage-wrap{border-radius:14px;box-shadow:none}
.lcd-t{display:flex;align-items:center;font-weight:900;color:#fff}
.guide{bottom:auto;top:6%;font-weight:800}

/* 창(modal): 어두운 판 · 살짝 커지며 나타나요 */
.modal-bg{background:#0009;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .26s ease both}
.modal{background:var(--panel);border:0;border-radius:18px;color:#fff;box-shadow:0 20px 50px #000a;animation:popIn .4s var(--spring) both}
.modal-bg.out{animation:fadeOut .22s ease both}
.modal-bg.out .modal{animation:popOut .22s ease both}
.modal h2{color:#fff}
.modal .hint,.modal .label{color:#a1a1a6}
.modal .btn{background:var(--panel2);color:#fff;box-shadow:none;border-radius:12px}
.modal .btn.primary,.modal .btn.accent{background:var(--acc);color:#fff}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes popOut{to{opacity:0;transform:scale(.96)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes menuIn{from{opacity:0;transform:scale(.7)}}

/* ---------- 공통: 이름 붙은 큰 아이콘 줄 ---------- */
.rail{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:2px;min-height:0;padding:4px 2px}
.ri{width:100%;max-width:var(--rail);border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 0;border-radius:14px;cursor:pointer;font:inherit;transition:transform .2s var(--spring),background-color .2s,color .2s}
.ri svg{width:clamp(26px,8.6cqh,38px);height:clamp(26px,8.6cqh,38px);stroke-width:1.7}
.ri span{font-size:clamp(10.5px,3.3cqh,13px);font-weight:700;line-height:1.1;color:#d1d1d6;white-space:nowrap;letter-spacing:-.02em}
.ri:active{transform:scale(.9);background:#ffffff1c}
.ri.on{color:var(--acc)}
.ri.on span{color:var(--acc)}
.ri.cam svg{color:#fff}
.ri.sm{width:auto;padding:4px}
.ri.sm svg{width:clamp(18px,6cqh,24px);height:clamp(18px,6cqh,24px)}

/* =========================================================
   촬영
   ========================================================= */
.sh{position:absolute;inset:0;display:grid;grid-template-columns:calc(var(--rail) + env(safe-area-inset-left)) minmax(0,1fr) calc(var(--rail) + env(safe-area-inset-right));background:#000}
.sh-l{padding-left:env(safe-area-inset-left)}
.sh-r{padding-right:env(safe-area-inset-right)}
.sh-c{position:relative;min-width:0;min-height:0;container-type:size}
.sh-mon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,100cqh*var(--ar,1.7778));aspect-ratio:var(--ar,1.7778);overflow:hidden;background:#000;border-radius:10px}
.sh-mon canvas{width:100%;height:100%;display:block}
.sh-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border-radius:999px;padding:5px 8px 5px 14px;font-size:clamp(12px,4cqh,15px);font-weight:800;white-space:nowrap;box-shadow:0 4px 14px #0008}
.sh-banner button{border:0;border-radius:999px;background:#fff;color:var(--acc);font:inherit;font-size:clamp(11px,3.6cqh,13px);font-weight:800;padding:3px 10px;cursor:pointer}
/* 아래 필름: 찍은 컷이 쌓여요 */
.sh-film{position:absolute;left:0;right:0;bottom:0;z-index:3;height:clamp(54px,21cqh,88px);display:flex;align-items:center;gap:8px;padding:0 10px;box-sizing:border-box;background:#000000b8;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sh-cnt{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:clamp(10px,3.2cqh,12px);font-weight:700;color:#d1d1d6;min-width:34px}
.sh-cnt b{font-size:clamp(18px,7cqh,28px);font-weight:900;color:#fff}
.sh-list{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 4px;scroll-behavior:smooth}
.sh-list::-webkit-scrollbar{display:none}
.sh-fr{flex:none;height:72%;aspect-ratio:var(--ar,1.7778);border:0;padding:0;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1.5px #ffffff55;transition:transform .2s var(--spring)}
.sh-fr img{width:100%;height:100%;object-fit:cover;display:block}
.sh-fr b{position:absolute;left:0;bottom:0;background:#000a;color:#fff;font-size:clamp(9px,3cqh,11px);font-weight:800;padding:0 5px;border-radius:0 5px 0 0}
.sh-fr:active{transform:scale(.94)}
.sh-fr.retake{box-shadow:0 0 0 3px var(--acc)}
.sh-ins{flex:none;width:4px;height:76%;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.sh-none{color:#aaa;font-size:clamp(11px,3.6cqh,14px);font-weight:700;white-space:nowrap;padding:0 6px}
/* 찰칵 · 다 찍었어요 */
.shutter{--d:min(clamp(64px,22cqh,92px),calc(var(--rail) - 6px));width:var(--d);height:var(--d);box-sizing:border-box;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.shutter .in{width:84%;height:84%;border-radius:50%;background:var(--rec);transition:all .15s}
.shutter:active .in{transform:scale(.9)}
.shutter.run .in{width:44%;height:44%;border-radius:8px;background:#8e8e93}
.sh-done{width:calc(100% - 8px);max-width:var(--rail);border:0;border-radius:16px;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;cursor:pointer;font:inherit;box-shadow:0 4px 14px #cf5d2a66;transition:transform .2s var(--spring)}
.sh-done svg{width:clamp(22px,7cqh,30px);height:clamp(22px,7cqh,30px)}
.sh-done span{display:flex;flex-direction:column;align-items:center;font-size:clamp(9.5px,3cqh,11.5px);font-weight:700;line-height:1.15}
.sh-done span b{font-size:clamp(12px,4cqh,15px);font-weight:900}
.sh-done:active{transform:scale(.94)}
/* 컷 창 */
.modal.wide:has(.cut){width:min(760px,calc(100% - 16px));padding:12px}
.cut{display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,30cqw,200px);gap:12px;align-items:stretch}
.cut-pic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;min-height:0}
.cut-img{width:100%;aspect-ratio:var(--ar,1.7778);object-fit:cover;border-radius:12px;background:#000;display:block;max-height:calc(100cqh - 80px)}
.cut-nav{width:34px;height:52px;border:0;border-radius:10px;background:var(--panel2);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.cut-nav svg{width:20px;height:20px}
.cut-nav:disabled{opacity:.25}
.cut-acts{display:flex;flex-direction:column;gap:6px;justify-content:center}
.cut-t{font-size:clamp(14px,4.6cqh,18px);font-weight:900;text-align:center;margin-bottom:4px}
.cut-b{border:0;border-radius:14px;background:var(--panel2);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;font-size:clamp(13px,4.2cqh,16px);font-weight:800;cursor:pointer;text-align:left}
.cut-b svg{width:24px;height:24px;flex:none;color:var(--acc)}
.cut-b.red{color:#ff6b5e}.cut-b.red svg{color:#ff6b5e}
.cut-b:active{transform:scale(.96)}

/* =========================================================
   꾸미기 · 보여주기
   ========================================================= */
.dc{position:absolute;inset:0;display:grid;grid-template-columns:calc(var(--rail) + env(safe-area-inset-left)) minmax(0,1fr) calc(clamp(200px,34cqw,330px) + env(safe-area-inset-right));background:#000}
.dc-l{padding-left:env(safe-area-inset-left)}
.dc-c{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 4px 8px 0}
.dc-mon{position:relative;flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.dc-mon canvas{width:min(100cqw,100cqh*var(--ar,1.7778));aspect-ratio:var(--ar,1.7778);height:auto;display:block;border-radius:10px;background:#000;cursor:pointer}
.dc-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(56px,20cqh,86px);height:clamp(56px,20cqh,86px);border-radius:50%;border:0;background:#000000a6;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:opacity .2s,transform .2s var(--spring);box-shadow:0 0 0 3px #ffffff66}
.dc-play svg{width:48%;height:48%;fill:currentColor;stroke:none}
.dc-play:active{transform:translate(-50%,-50%) scale(.9)}
.dc-play.hide{opacity:0;pointer-events:none}
.dc-mon .guide{left:4%;right:4%;top:4%;bottom:auto;background:#FF3B30d0;text-align:center;font-size:clamp(11px,3.6cqh,14px)}
.dc-mon .count{font-size:clamp(60px,36cqh,160px)}
.dc-bar{flex:none;display:flex;align-items:center;gap:6px;padding:0 4px}
.dc-track{flex:1;position:relative;height:clamp(26px,9cqh,36px);display:flex;align-items:center}
.dc-rng{width:100%;margin:0;accent-color:var(--acc);height:100%;position:relative;z-index:1;background:transparent}
.dc-marks{position:absolute;left:8px;right:8px;top:50%;height:10px;transform:translateY(-50%);pointer-events:none;z-index:0}
.dc-marks i{position:absolute;top:0;height:100%;border-radius:3px;min-width:6px;transform:translateX(-50%)}
.dc-marks i.sfx{width:6px;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.dc-marks i.narr{transform:none;background:#2F9C9A;opacity:.85;margin-left:-3px}
.dc-time{flex:none;font-size:clamp(11px,3.4cqh,13px);font-weight:700;color:#d1d1d6;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.dc-speed{display:flex;flex-direction:column;align-items:center;gap:3px;width:calc(100% - 6px)}
.dc-speed span{font-size:clamp(9.5px,3cqh,11.5px);font-weight:700;color:#8e8e93}
.dc-speed button{width:100%;border:0;border-radius:9px;background:var(--panel2);color:#d1d1d6;font:inherit;font-size:clamp(10.5px,3.3cqh,13px);font-weight:800;padding:clamp(3px,1.3cqh,6px) 2px;cursor:pointer}
.dc-speed button.on{background:#fff;color:#111}
/* 오른쪽 도구 판 */
.dc-r{min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 8px 8px 4px;padding-right:max(8px,env(safe-area-inset-right))}
.dc-tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);border-radius:14px;padding:4px}
.dc-tabs button{border:0;border-radius:11px;background:none;color:#d1d1d6;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;font:inherit;font-size:clamp(9.5px,3cqh,12px);font-weight:800;transition:transform .2s var(--spring),background-color .2s}
.dc-tabs button svg{width:clamp(20px,6.6cqh,28px);height:clamp(20px,6.6cqh,28px)}
.dc-tabs button.on{background:var(--acc);color:#fff}
.dc-tabs button:active{transform:scale(.92)}
.dc-pane{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:clamp(5px,2cqh,8px);background:var(--panel);border-radius:14px;padding:10px;scrollbar-width:none}
.dc-pane::-webkit-scrollbar{display:none}
.dc-tip{margin:0;font-size:clamp(11px,3.4cqh,13px);color:#a1a1a6;line-height:1.4;text-align:center;flex:none}
.dc-none{color:#8e8e93;font-size:12.5px;text-align:center;padding:8px}
.dc-tg{color:#ddd;font-size:12.5px;justify-content:center;flex:none}
.dc-title{display:flex;flex-direction:column;gap:3px;flex:none}
.dc-title span{font-size:11px;font-weight:700;color:#8e8e93}
.dc-title .input{font-size:15px;font-weight:800;padding:clamp(5px,2cqh,8px) 10px;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(60px,19cqh,84px),1fr));gap:6px;flex:none}
.tl{border:2px solid transparent;border-radius:12px;background:var(--panel2);color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font:inherit;cursor:pointer;--tc:var(--acc);transition:transform .2s var(--spring),background-color .2s;min-width:0}
.tl i{width:clamp(28px,9cqh,38px);height:clamp(28px,9cqh,38px);border-radius:50%;background:color-mix(in srgb,var(--tc) 30%,transparent);display:grid;place-items:center}
.tl i svg{width:58%;height:58%}
.tl span{font-size:clamp(10px,3.1cqh,12px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl:active{transform:scale(.92)}
.tl.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 32%,var(--panel2))}
.tl.on i{background:var(--tc)}
.rec-big{align-self:center;flex:none;border:0;border-radius:999px;background:var(--rec);color:#fff;font:inherit;font-size:clamp(15px,5cqh,19px);font-weight:900;padding:clamp(8px,3cqh,13px) 24px clamp(8px,3cqh,13px) 18px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 14px #ff3b3066}
.rec-big svg{width:clamp(22px,7cqh,28px);height:clamp(22px,7cqh,28px)}
.rec-big.run{animation:micPulse 1s infinite;background:#8e8e93;box-shadow:none}
.rec-big:active{transform:scale(.95)}
@keyframes micPulse{50%{box-shadow:0 0 0 10px #ff3b3044}}
.clips{display:flex;flex-direction:column;gap:4px;flex:none}
.clip{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:5px 6px 5px 10px}
.clip b{font-size:13px;color:#7fd6d4}
.clip small{font-size:11px;color:#a1a1a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip button{width:30px;height:30px;border:0;border-radius:50%;background:var(--panel3);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.clip button svg{width:15px;height:15px}
.clip button.red{color:#ff6b5e}
.clip button:disabled{opacity:.35}
.share-b{flex:none;border:0;border-radius:14px;background:var(--panel2);color:#fff;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:clamp(6px,2.4cqh,10px) 12px;font:inherit;cursor:pointer;text-align:left;transition:transform .2s var(--spring)}
.share-b svg{grid-row:1/3;width:clamp(24px,8cqh,32px);height:clamp(24px,8cqh,32px);color:var(--acc)}
.share-b b{font-size:clamp(13px,4.2cqh,16px);font-weight:900}
.share-b small{font-size:clamp(10px,3.2cqh,12px);color:#a1a1a6}
.share-b.or{background:var(--acc)}
.share-b.or svg,.share-b.or small{color:#fff}
.share-b:active{transform:scale(.96)}

/* =========================================================
   내 작품
   ========================================================= */
.gal-screen{flex-direction:row;transition:transform .38s var(--spring),filter .38s}
.g-rail{flex:none;width:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 calc(10px + env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);background:var(--panel)}
.g-rb{width:calc(100% - 8px);border:0;border-radius:12px;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;cursor:pointer;font:inherit;transition:transform .2s var(--spring),background-color .2s}
.g-rb svg{width:clamp(26px,8.4cqh,32px);height:clamp(26px,8.4cqh,32px);stroke-width:1.7}
.g-rb span{font-size:clamp(10px,3.1cqh,12.5px);font-weight:700;line-height:1.1;color:#d1d1d6;white-space:nowrap}
.g-rb.on{background:var(--panel3)}
.g-rb:active{transform:scale(.92)}
.g-sp{flex:1}
.g-main{flex:1;min-width:0;display:flex;flex-direction:column;padding-right:env(safe-area-inset-right)}
.g-top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px 6px;height:clamp(40px,13cqh,52px);box-sizing:border-box}
.g-h{font-size:clamp(15px,5cqh,20px);font-weight:900}
.g-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,24cqw,250px),1fr));align-content:start;gap:clamp(12px,2.4cqw,22px) clamp(10px,2cqw,18px);padding:4px 16px calc(16px + env(safe-area-inset-bottom))}
.g-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;color:#fff;font:inherit;cursor:pointer;padding:0;min-width:0;transition:transform .15s;-webkit-touch-callout:none}
.g-card:active{transform:scale(.97)}
.g-card .th{width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--panel2) center/cover;display:grid;place-items:center;color:#fff}
.g-card .th.empty{background:#000;outline:1px solid var(--panel2)}
.g-card .th svg{width:30%;height:auto;max-height:46%}
.g-card.new .th{background:var(--acc)}
.g-card.new .th svg{width:30%;stroke-width:2.2}
.g-card .tt{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%;text-align:center}
.g-card .tt b{font-size:clamp(13px,4.2cqh,16px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.g-card .tt small{font-size:clamp(10px,3cqh,11.5px);color:#8e8e93}
.g-more{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:0;background:#000a;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.g-more svg{width:18px;height:18px}
.g-none{grid-column:1/-1;color:#8e8e93;text-align:center;padding:30px 10px}
.zoomer{position:absolute;z-index:300;background:#000 center/cover;display:grid;place-items:center;color:#fff;pointer-events:none;overflow:hidden}
.zoomer svg{width:min(18%,90px);height:auto}
/* 길게 누르기 메뉴 */
.cm-bg{position:absolute;inset:0;z-index:350;animation:fadeIn .18s both}
.cm-bg.dim{background:#0006;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cm-bg.out{animation:fadeOut .16s both}
.cm-lift{position:absolute;margin:0;transform:scale(1.04);transition:none;animation:lift .26s var(--pop) both;pointer-events:none}
@keyframes lift{from{transform:scale(1)}}
.cm{position:absolute;min-width:200px;max-width:min(280px,80cqw);background:#2c2c2ef2;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:5px;box-shadow:0 12px 40px #000c;display:flex;flex-direction:column;animation:menuIn .34s var(--pop) both;max-height:calc(100cqh - 16px);overflow:auto;box-sizing:border-box}
.cm-bg.out .cm{animation:popOut .16s ease both}
.cm-i{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;font:inherit;font-size:15px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;white-space:nowrap}
.cm-i:active{background:#ffffff1f}
.cm-i.red{color:#ff453a}
