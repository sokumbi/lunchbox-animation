<style>
/* =========================================================
   단순한 세 화면 테마 (2026-10-31) — 검은 바탕 · 크고 이름 붙은 아이콘
   p1_head의 런치박스 스킨 위에 덮어써요. 화면은 p6_simple.js
   ========================================================= */
:root{--acc:#CF5D2A;--rec:#FF3B30;--panel:#1c1c1e;--panel2:#2c2c2e;--panel3:#3a3a3c;--spring:cubic-bezier(.32,.72,0,1);--pop:cubic-bezier(.2,.9,.25,1.12);--rail:clamp(62px,9.5cqw,88px)}
body,#app,.screen{background:#000;color:#fff}
#studio .tray{margin:0;border:0;border-radius:0;background:#000;box-shadow:none;padding:0;gap:0}
#studio .tray::before{display:none}
.btn{background:var(--panel2);border:0;color:#fff;box-shadow:none;border-radius:12px}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.primary,.btn.accent,.btn.rec{background:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.input,.field input,.field textarea{background:var(--panel2);color:#fff;border:0;box-shadow:none}
.toggle input{box-shadow:none;accent-color:var(--acc)}
.toast{background:#2c2c2ef0;color:#fff;box-shadow:0 6px 20px #0008;animation:toastIn .38s var(--spring) both}
.toast.out{animation:toastOut .22s ease both}
.toast.top{top:calc(18% + env(safe-area-inset-top,0px));bottom:auto}
.stage-wrap,.monitor{aspect-ratio:var(--ar,1.7778)}
.monitor{background:#000;padding:0;border:0;border-radius:14px;box-shadow:none}
.monitor .stage-wrap{border-radius:14px;box-shadow:none}
.lcd-t{display:flex;align-items:center;font-weight:900;color:#fff}
.guide{bottom:auto;top:6%;font-weight:800}

/* 창(modal): 어두운 판 · 살짝 커지며 나타나요 */
.modal-bg{background:#0009;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .26s ease both}
.modal{background:var(--panel);border:0;border-radius:18px;color:#fff;box-shadow:0 20px 50px #000a;animation:popIn .4s var(--spring) both}
.modal-bg.out{animation:fadeOut .22s ease both}
.modal-bg.out .modal{animation:popOut .22s ease both}
.modal h2{color:#fff}
.modal .hint,.modal .label{color:#a1a1a6}
.modal .btn{background:var(--panel2);color:#fff;box-shadow:none;border-radius:12px}
.modal .btn.primary,.modal .btn.accent{background:var(--acc);color:#fff}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes popOut{to{opacity:0;transform:scale(.96)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@keyframes menuIn{from{opacity:0;transform:scale(.7)}}

/* ---------- 공통: 이름 붙은 큰 아이콘 줄 ---------- */
.rail{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:2px;min-height:0;padding:4px 2px}
.ri{width:100%;max-width:var(--rail);border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;border-radius:14px;cursor:pointer;font:inherit;transition:transform .2s var(--spring),background-color .2s,color .2s}
.ri svg{width:clamp(26px,8.2cqh,36px);height:clamp(26px,8.2cqh,36px);stroke-width:1.7}
.ri span{font-size:clamp(12px,3.7cqh,14px);font-weight:700;line-height:1.1;color:#d1d1d6;white-space:nowrap;letter-spacing:-.02em}
.ri:active{transform:scale(.9);background:#ffffff1c}
.ri.on{color:var(--acc)}
.ri.on span{color:var(--acc)}
/* 클레이 아이콘: 색을 바꿀 수 없으니 켜진 버튼은 아이콘 뒤에 주황빛 판을 깔아요 */
svg.clay{overflow:visible;filter:drop-shadow(0 1px 1.5px #0007)}
.ri.on svg.clay,.g-rb.on svg.clay{background:color-mix(in srgb,var(--acc) 38%,transparent);border-radius:30%;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 38%,transparent)}
.ri.cam svg{color:#fff}
.ri.sm{width:auto;padding:4px}
.ri.sm svg{width:clamp(18px,6cqh,24px);height:clamp(18px,6cqh,24px)}

/* =========================================================
   촬영
   ========================================================= */
.sh{position:absolute;inset:0;display:grid;grid-template-columns:max(var(--rail),calc(env(safe-area-inset-left) + 58px)) minmax(0,1fr) max(var(--rail),calc(env(safe-area-inset-right) + 58px));background:#000}
.sh-l{padding-left:env(safe-area-inset-left)}
.sh-r{padding-right:env(safe-area-inset-right)}
.sh-c{position:relative;min-width:0;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px}
/* 카메라 자리: 가로가 꽉 차는 16:9 높이, 남는 높이에서 필름 띠를 뺀 만큼까지 */
.sh-stage{position:relative;flex:none;min-height:0;height:calc(100cqw / var(--ar,1.7778));max-height:calc(100cqh - clamp(48px,17cqh,80px) - 6px);container-type:size}
.sh-mon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,100cqh*var(--ar,1.7778));aspect-ratio:var(--ar,1.7778);overflow:hidden;background:#000;border-radius:10px;box-shadow:0 0 0 1.5px #ffffff66}
.sh-mon canvas{width:100%;height:100%;display:block}
.sh-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;background:var(--acc);color:#fff;border-radius:999px;padding:5px 8px 5px 14px;font-size:clamp(12px,4cqh,15px);font-weight:800;white-space:nowrap;box-shadow:0 4px 14px #0008}
.sh-banner button{border:0;border-radius:999px;background:#fff;color:var(--acc);font:inherit;font-size:clamp(11px,3.6cqh,13px);font-weight:800;padding:3px 10px;cursor:pointer}
/* 초점: 누른 자리에 노란 네모가 잠깐, 직접 조절이 되는 기기는 오른쪽에 세로 막대 */
.fc-ring{position:absolute;z-index:4;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #FFD54A;border-radius:10px;pointer-events:none;opacity:0}
.fc-ring.go{animation:fcRing 1.1s ease forwards}
@keyframes fcRing{0%{opacity:1;transform:scale(1.5)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.fc-box{position:absolute;z-index:3;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:14px;background:#000a;color:#fff;font-size:11px;font-weight:800}
.fc-box[hidden]{display:none}
.fc-range{writing-mode:vertical-lr;direction:rtl;width:28px;height:min(46cqh,160px);margin:0;accent-color:#FFD54A}
.fc-auto{border:0;border-radius:999px;background:#ffffff26;color:#fff;font:inherit;font-size:11px;font-weight:800;padding:3px 8px;cursor:pointer}
.fc-auto.on{background:#FFD54A;color:#222}
/* 아래 필름: 찍은 컷이 쌓여요. 카메라 화면 밖(아래)에 있어서 화면을 가리지 않아요 */
.sh-film{position:relative;flex:none;height:clamp(48px,17cqh,80px);display:flex;align-items:center;gap:8px;padding:0 6px;box-sizing:border-box}
.sh-cnt{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:clamp(11px,3.4cqh,12.5px);font-weight:700;color:#fff;min-width:34px;text-shadow:0 1px 4px #000c}
.sh-cnt b{font-size:clamp(18px,7cqh,28px);font-weight:900;color:#fff}
.sh-list{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 4px;scroll-behavior:smooth}
.sh-list::-webkit-scrollbar{display:none}
.sh-fr{flex:none;height:80%;box-shadow:0 2px 8px #000c;aspect-ratio:var(--ar,1.7778);border:0;padding:0;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1.5px #ffffff55;transition:transform .2s var(--spring)}
.sh-fr img{width:100%;height:100%;object-fit:cover;display:block}
.sh-fr b{position:absolute;left:0;bottom:0;background:#000a;color:#fff;font-size:clamp(10px,3.2cqh,12px);font-weight:800;padding:0 5px;border-radius:0 5px 0 0}
.sh-fr:active{transform:scale(.94)}
.sh-fr.retake{box-shadow:0 0 0 3px var(--acc)}
.sh-fr.now,.sh-fr.sel{box-shadow:0 0 0 3px var(--acc)}
.sh-pop{position:absolute;z-index:6;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#2c2c2ef5;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px;box-shadow:0 6px 20px #000a;animation:popUp .18s var(--pop) both}
@keyframes popUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
.sh-pop button{border:0;border-radius:10px;background:none;color:#fff;font:inherit;font-size:clamp(11.5px,3.5cqh,13px);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.sh-pop button svg{width:clamp(18px,6cqh,24px);height:clamp(18px,6cqh,24px);color:var(--acc)}
.sh-pop button.red,.sh-pop button.red svg{color:#ff6b5e}
.sh-pop button:active{background:#ffffff1f}
.sh-pop-tip{position:absolute;bottom:-6px;width:12px;height:12px;background:#2c2c2ef5;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.sh-ins{flex:none;width:4px;height:76%;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
/* 전래동화 따라 찍기: 촬영 화면 위 장면 자막 안내 */
.sh-guide{position:absolute;top:6px;left:4%;right:4%;width:fit-content;max-width:min(100%,560px);margin:0 auto;z-index:3;display:flex;align-items:center;gap:4px;box-sizing:border-box;background:#000000b8;color:#fff;border-radius:16px;padding:4px 6px 4px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sh-gd-e{font-size:clamp(16px,6cqh,22px);line-height:1;flex:none}
.sh-guide button{border:0;background:#ffffff22;color:#fff;border-radius:50%;width:clamp(26px,9cqh,32px);height:clamp(26px,9cqh,32px);display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
.sh-guide button svg{width:16px;height:16px}
.sh-guide button:disabled{opacity:.3}
.sh-gd-c{display:flex;align-items:center;gap:6px;min-width:0;font-size:clamp(11.5px,3.8cqh,14px);font-weight:700;line-height:1.25}
.sh-gd-c b{flex:none;color:var(--acc);font-weight:900}
.sh-gd-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-mon.tale .sh-banner{top:calc(12px + clamp(34px,12cqh,44px))}
.sh-none{color:#aaa;font-size:clamp(11px,3.6cqh,14px);font-weight:700;white-space:nowrap;padding:0 6px;text-shadow:0 1px 4px #000c}
/* 찰칵 · 다 찍었어요 */
.shutter{--d:min(clamp(64px,22cqh,92px),calc(var(--rail) - 6px));width:var(--d);height:var(--d);box-sizing:border-box;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
.shutter .in{width:84%;height:84%;border-radius:50%;background:var(--rec);transition:all .15s}
.shutter:active .in{transform:scale(.9)}
.shutter.run .in{width:44%;height:44%;border-radius:8px;background:#8e8e93}
.sh-done{width:calc(100% - 8px);max-width:var(--rail);border:0;border-radius:16px;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;cursor:pointer;font:inherit;box-shadow:0 4px 14px #cf5d2a66;transition:transform .2s var(--spring)}
.sh-done svg{width:clamp(22px,7cqh,30px);height:clamp(22px,7cqh,30px)}
.sh-done span{display:flex;flex-direction:column;align-items:center;font-size:clamp(11px,3.4cqh,12.5px);font-weight:700;line-height:1.15;word-break:keep-all;text-align:center}
.sh-done span b{font-size:clamp(13px,4.3cqh,16px);font-weight:900}
.sh-done:active{transform:scale(.94)}
/* 컷 창 */
.modal.wide:has(.cut){width:min(760px,calc(100% - 16px));padding:12px}
.cut{display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,30cqw,200px);gap:12px;align-items:stretch}
.cut-pic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;min-height:0}
.cut-img{width:100%;aspect-ratio:var(--ar,1.7778);object-fit:cover;border-radius:12px;background:#000;display:block;max-height:calc(100cqh - 80px)}
.cut-nav{width:34px;height:52px;border:0;border-radius:10px;background:var(--panel2);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.cut-nav svg{width:20px;height:20px}
.cut-nav:disabled{opacity:.25}
.cut-acts{display:flex;flex-direction:column;gap:6px;justify-content:center}
.cut-t{font-size:clamp(14px,4.6cqh,18px);font-weight:900;text-align:center;margin-bottom:4px}
.cut-b{border:0;border-radius:14px;background:var(--panel2);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;font-size:clamp(13px,4.2cqh,16px);font-weight:800;cursor:pointer;text-align:left}
.cut-b svg{width:24px;height:24px;flex:none;color:var(--acc)}
.cut-b.red{color:#ff6b5e}.cut-b.red svg{color:#ff6b5e}
.cut-b:active{transform:scale(.96)}

/* =========================================================
   꾸미기 · 보여주기
   ========================================================= */
.dc{position:absolute;inset:0;display:grid;grid-template-columns:calc(var(--rail) + env(safe-area-inset-left)) minmax(0,1fr) calc(clamp(200px,34cqw,330px) + env(safe-area-inset-right));background:#000}
.dc-l{padding-left:env(safe-area-inset-left)}
.dc-c{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 4px 8px 0}
.dc-mon{position:relative;flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.dc-mon canvas{width:min(100cqw,100cqh*var(--ar,1.7778));aspect-ratio:var(--ar,1.7778);height:auto;display:block;border-radius:10px;background:#000;cursor:pointer}
.dc-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(56px,20cqh,86px);height:clamp(56px,20cqh,86px);border-radius:50%;border:0;background:#000000a6;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:opacity .2s,transform .2s var(--spring);box-shadow:0 0 0 3px #ffffff66}
.dc-play svg{width:48%;height:48%;fill:currentColor;stroke:none}
.dc-play:active{transform:translate(-50%,-50%) scale(.9)}
.dc-play.hide{opacity:0;pointer-events:none}
.dc-mon .guide{left:4%;right:4%;top:4%;bottom:auto;background:#FF3B30d0;text-align:center;font-size:clamp(11px,3.6cqh,14px)}
.dc-mon .count{font-size:clamp(60px,36cqh,160px)}
/* 타임라인: 왼쪽 이름 칸 + 오른쪽(컷 썸네일 줄 · 말 · 소리 · 음악) */
.tml{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 6px;padding:0 6px 0 2px;height:clamp(84px,32cqh,128px);--tmlr:minmax(0,2.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.tml-labels,.tml-body{display:grid;grid-template-rows:var(--tmlr);gap:3px;min-height:0}
.tml-body{position:relative;touch-action:none;cursor:pointer}
.tml-time{align-self:center;justify-self:end;font-size:clamp(10px,3.2cqh,12px);font-weight:700;color:#8e8e93;font-variant-numeric:tabular-nums;padding-right:2px}
.tml-lab{border:0;background:none;font:inherit;display:flex;align-items:center;gap:3px;padding:0 2px;cursor:pointer;font-size:clamp(11px,3.4cqh,12.5px);font-weight:800;min-height:0}
.tml-lab svg{width:clamp(13px,4.4cqh,16px);height:clamp(13px,4.4cqh,16px);flex:none}
.tml-film{width:100%;height:100%;display:block;border-radius:6px;background:var(--panel2);min-height:0}
.tml-row{position:relative;background:var(--panel);border-radius:6px;min-height:0;overflow:hidden}
.tml-empty{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-size:clamp(9px,3cqh,11px);color:#6e6e73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tml-it{position:absolute;top:1px;bottom:1px;border:0;border-radius:999px;color:#fff;font:inherit;font-size:clamp(10px,3.3cqh,12px);font-weight:800;display:flex;align-items:center;gap:3px;padding:0 7px 0 4px;cursor:pointer;white-space:nowrap;overflow:hidden;box-sizing:border-box;min-width:20px;transition:transform .2s var(--spring)}
.tml-it svg{width:clamp(11px,3.6cqh,14px);height:clamp(11px,3.6cqh,14px);flex:none}
.tml-it:active{transform:scale(.94)}
.tml-row.narr .tml-it{background:#2F9C9A}
.tml-row.sfx .tml-it{background:var(--acc)}
.tml-row.bgm .tml-it{background:#4E9A63}
.tml-row.bgm .tml-it span{margin-left:auto}
.tml-row.narr .tml-it{min-width:48px}
.tml-x{margin-left:auto;flex:none;width:clamp(16px,5.4cqh,20px);height:clamp(16px,5.4cqh,20px);border-radius:50%;background:#00000050;display:grid;place-items:center;cursor:pointer}
.tml-x svg{width:60%;height:60%}
.tml-x:active{background:#000000a0}
.tml-head{position:absolute;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-1px);pointer-events:none;z-index:4;box-shadow:0 0 4px #000}
.tml-head.l b{transform:translateX(0)}
.tml-head.r b{transform:translateX(-100%)}
.tml-head b{position:absolute;top:2px;left:50%;transform:translateX(-50%);transition:transform .15s;background:#000d;color:#fff;font-size:clamp(9px,3cqh,11px);font-weight:800;padding:1px 5px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-speed{display:flex;flex-direction:column;align-items:center;gap:3px;width:calc(100% - 6px)}
.dc-speed span{font-size:clamp(9.5px,3cqh,11.5px);font-weight:700;color:#8e8e93}
.dc-speed button{width:100%;border:0;border-radius:9px;background:var(--panel2);color:#d1d1d6;font:inherit;font-size:clamp(12px,3.6cqh,13.5px);font-weight:800;padding:clamp(3px,1.3cqh,6px) 2px;cursor:pointer}
.dc-speed button.on{background:#fff;color:#111}
/* 오른쪽 도구 판 */
.dc-r{min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 8px 8px 4px;padding-right:max(8px,env(safe-area-inset-right))}
.dc-tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);border-radius:14px;padding:4px}
.dc-tabs button{border:0;border-radius:11px;background:none;color:#d1d1d6;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;font:inherit;font-size:clamp(11.5px,3.5cqh,13px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;min-width:0;transition:transform .2s var(--spring),background-color .2s}
.dc-tabs button svg{width:clamp(20px,6.6cqh,28px);height:clamp(20px,6.6cqh,28px)}
.dc-tabs button.on{background:var(--acc);color:#fff}
.dc-tabs button:active{transform:scale(.92)}
.dc-pane{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:clamp(5px,2cqh,8px);background:var(--panel);border-radius:14px;padding:10px;scrollbar-width:none}
.dc-pane::-webkit-scrollbar{display:none}
.dc-tip{margin:0;font-size:clamp(11px,3.4cqh,13px);color:#a1a1a6;line-height:1.4;text-align:center;flex:none}
.dc-none{color:#8e8e93;font-size:12.5px;text-align:center;padding:8px}
.dc-tg{color:#ddd;font-size:12.5px;justify-content:center;flex:none}
.dc-title{display:flex;flex-direction:column;gap:3px;flex:none}
.dc-title span{font-size:11px;font-weight:700;color:#8e8e93}
.dc-title .input{font-size:15px;font-weight:800;padding:clamp(5px,2cqh,8px) 10px;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(60px,19cqh,84px),1fr));gap:6px;flex:none}
.tl{border:2px solid transparent;border-radius:12px;background:var(--panel2);color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font:inherit;cursor:pointer;--tc:var(--acc);transition:transform .2s var(--spring),background-color .2s;min-width:0}

/* 길게 누르기 메뉴 */

@keyframes splashIn{0%{opacity:0;transform:scale(.7) rotate(-4deg)}100%{opacity:1;transform:none}}
